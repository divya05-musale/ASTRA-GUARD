steps:
  - step_id: S001
    order: 1
    activity: CHECK_EQUIPMENT
    expected_object: experiment_container
    required: true
    timeout_sec: 20
    description: >
      Verify the experiment container and required equipment before
      beginning the synthetic experimental sequence.
  - step_id: S002
    order: 2
    activity: RETRIEVE_SAMPLE
    expected_object: biological_sample
    required: true
    timeout_sec: 30
    description: >
      Retrieve the biological sample from the experiment container.
  - step_id: S003
    order: 3
    activity: OPEN_CONTAINER
    expected_object: sample_chamber
    required: true
    timeout_sec: 30
    description: >
      Open the sample chamber before transferring the biological sample.
  - step_id: S004
    order: 4
    activity: TRANSFER_SAMPLE
    expected_object: sample_chamber
    required: true
    timeout_sec: 40
    description: >
      Transfer the biological sample into the designated sample chamber.
  - step_id: S005
    order: 5
    activity: START_EXPERIMENT
    expected_object: experiment_controller
    required: true
    timeout_sec: 20
    description: >
      Start the synthetic experiment using the experiment controller.
  - step_id: S006
    order: 6
    activity: RECORD_RESULT
    expected_object: observation_interface
    required: true
    timeout_sec: 60
    description: >
      Record the observed experimental result using the observation interface.
  - step_id: S007
    order: 7
    activity: SECURE_SAMPLE
    expected_object: sample_chamber
    required: true
    timeout_sec: 30
    description: >
      Secure the sample chamber after recording the observation.
  - step_id: S008
    order: 8
    activity: COMPLETE_EXPERIMENT
    expected_object: experiment_controller
    required: true
    timeout_sec: 20
    description: >
      Complete the synthetic experiment using the experiment controller.

